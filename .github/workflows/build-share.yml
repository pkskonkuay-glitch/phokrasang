name: build-share
on:
  push:
    branches: [main]
    paths: ["index.html", "vocab.html", "privacy.html", "sw.js", "manifest.webmanifest", "build-share.js"]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-share        # รันทีละรอบ ไม่ให้บอตสองรอบชนกันเอง
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node build-share.js
      - run: |
          git config user.name "share-bot"
          git config user.email "share-bot@users.noreply.github.com"
          git add s data sitemap.xml robots.txt config.js
          git diff --cached --quiet || (git commit -m "อัปเดตหน้าแชร์รายเรื่อง" && git pull --rebase -X theirs origin main && git push)
